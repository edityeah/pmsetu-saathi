# Render Blueprint — provisions PM-SETU Saathi in one click.
#
#   1. Push this repo to GitHub (see docs/DEPLOY_RENDER.md).
#   2. Render → New + → Blueprint → pick the repo. Render reads this file and
#      creates the web service, the Postgres database and the env vars.
#   3. In the dashboard set OPENAI_API_KEY (marked sync: false below).
#   4. After the first deploy, seed the demo data once:
#        curl -X POST https://<service>.onrender.com/api/admin/seed -H "x-admin-token: <ADMIN_TOKEN>"
#      (ADMIN_TOKEN is generated by Render; copy it from the service's Environment tab.)
#
# Plans: the web service is on `starter` so it never spins down (free instances
# sleep after 15 minutes idle); the database is on `basic-256mb`, the smallest
# plan that does not expire (free Postgres is deleted after 30 days). Both can
# be changed in the dashboard without touching this file.

services:
  - type: web
    name: pmsetu-saathi
    runtime: node
    plan: starter
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: |
      set -e
      cd server && npm install --include=dev --no-audit --no-fund
      node scripts/postgres-schema.cjs
      npx prisma generate --schema prisma/schema.postgres.prisma
      cd ../web && npm install --include=dev --no-audit --no-fund && npm run build
      test -f dist/index.html || (echo 'Vite build failed: web/dist/index.html missing' && exit 1)
    # start.cjs applies the Prisma schema to the database (db push) and then
    # execs the Express server, which serves /api/* and the built SPA.
    startCommand: node start.cjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true          # protects /api/admin/* (seed, status)
      - key: OPENAI_API_KEY
        sync: false                  # set in the dashboard; UI works without it, Saathi replies need it
      - key: OPENAI_CHAT_MODEL
        value: gpt-4o
      - key: OPENAI_EMBED_MODEL
        value: text-embedding-3-small
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime
      - key: OPENAI_REALTIME_VOICE
        value: verse
      - key: RATE_LIMIT_PER_HOUR
        value: "200"
      - key: ALLOWED_ORIGIN
        value: "*"                   # SPA is served from the same origin
      - key: ANAM_API_KEY
        sync: false                  # optional: avatar video calls
      - key: ANAM_AVATAR_ID
        sync: false
      - key: ANAM_VOICE_ID
        sync: false
      - key: ZEP_API_KEY
        sync: false                  # optional: conversation memory
      - key: CARTESIA_API_KEY
        sync: false                  # optional: Indian-language TTS
      - key: CARTESIA_VOICE_ID
        sync: false
      - key: CARTESIA_MODEL_ID
        value: sonic-2
      - key: DATABASE_URL
        fromDatabase:
          name: pmsetu-db
          property: connectionString

databases:
  - name: pmsetu-db
    plan: basic-256mb
    databaseName: pmsetu
    user: pmsetu
    region: singapore
    postgresMajorVersion: "16"
